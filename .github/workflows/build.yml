name: Build so‑NDKBuild
on: push

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          local‑ndk‑path: ndk

      - name: 编译
        env:
          NDK_PATH: ${{ github.workspace }}/ndk
        run: |
          mkdir -p obj libs
          $NDK_PATH/ndk‑build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk

      - name: 上传so
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/
