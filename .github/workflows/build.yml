name: Build so-NDKBuild
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Android NDK r27b
        id: cache_ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk
          key: ndk-r27b-v2

      - name: Download NDK (Mirror fallback)
        if: steps.cache_ndk.outputs.cache-hit != 'true'
        run: |
          cd ${{ runner.temp }}
          FILE="android-ndk-r27b-linux.zip"
          wget -q --timeout=90 --tries=3 https://mirrors.aliyun.com/android-ndk/$FILE || \
          wget -q --timeout=90 --tries=3 https://dl.google.com/android/repository/$FILE
          unzip -q -o $FILE
          mv android-ndk-r27b android-ndk

      - name: Export NDK environment
        run: |
          echo "NDK_PATH=${{ runner.temp }}/android-ndk" >> $GITHUB_ENV
          echo "${{ runner.temp }}/android-ndk" >> $GITHUB_PATH

      - name: Start ndk-build compile
        run: |
          pwd
          ls -la
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk
      
      - name: Debug 遍历全部文件，查找so
        run: |
          echo "===根目录文件==="
          ls -la
          echo "===libs文件夹==="
          ls -la libs/ || echo "❌libs文件夹不存在"
          echo "===查找全部.so文件==="
          find . -name "*.so"
      
      - name: Upload compiled so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-libs
          path: libs/
          retention-days: 7
